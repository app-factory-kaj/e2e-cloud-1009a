openapi: 3.0.3
info:
  title: Greeter API
  version: 0.1.0
  description: Returns a JSON greeting for a given name.
servers:
  - url: /
paths:
  /hello:
    get:
      operationId: getGreeting
      summary: Return a JSON greeting for the given name, or "World" when none is given
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: The name to greet; defaults to "World" when absent or empty
      responses:
        '200':
          description: The rendered greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        '200':
          description: The service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Greeting:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: The rendered greeting sentence, e.g. "Hello, World!"
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always "ok" when the service is up
